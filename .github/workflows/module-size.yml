name: Rust module size

# Annotates PRs that grow a Rust module past 3,000 lines and fails PRs that grow
# one past 400 KB, where GitHub stops syntax highlighting the diff. Modules in
# ci/module_size_exceptions.txt only get a warning. The thresholds live in
# ci/check_module_size.py.

on:
  pull_request:
    branches:
      - main
      - release/**
    paths:
      - "**.rs"
      - ci/check_module_size.py
      - ci/module_size_exceptions.txt
      - .github/workflows/module-size.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check Rust module sizes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history (without blobs) is needed to find the merge base.
          fetch-depth: 0
          filter: blob:none
      # The checkout is the PR's test merge commit: HEAD^1 is the base branch
      # and HEAD^2 is the PR head.
      - name: Check module sizes
        run: python3 ci/check_module_size.py HEAD^1 HEAD^2 --summary "$GITHUB_STEP_SUMMARY"
