name: Validate v14 RC2 backport

on:
  workflow_dispatch:
    inputs:
      pr_urls:
        required: true
        type: string
        default: https://github.com/lance-format/lance/pull/10149
      release_branch:
        required: true
        type: string
        default: release/v14.0
      guidelines:
        required: false
        type: string

permissions:
  contents: read

env:
  CC: clang
  CXX: clang++
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/v14.0
          fetch-depth: 0
          token: ${{ secrets.LANCE_RELEASE_TOKEN }}
      - name: Prepare exact backport candidate
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.LANCE_RELEASE_TOKEN }}
          PR_URLS: ${{ inputs.pr_urls }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PR_URLS" = https://github.com/lance-format/lance/pull/10149
          test "$RELEASE_BRANCH" = release/v14.0
          test "$(git rev-parse HEAD)" = f86d8c1ffcb6b4e077b906389a39befa2a57d71c
          test "$(gh pr view 10149 --repo lance-format/lance --json state --jq .state)" = MERGED
          test "$(gh pr view 10149 --repo lance-format/lance --json mergeCommit --jq .mergeCommit.oid)" = 356164431913a6a0f35f9b8aff364c095a844c22
          git config user.name lance-community
          git config user.email community@lance.org
          git fetch origin main
          branch=backport/pr-10149-to-release-v14.0
          if git ls-remote --exit-code --heads origin "$branch"; then
            git fetch origin "$branch"
            git checkout --detach FETCH_HEAD
          else
            git checkout -b "$branch"
            git cherry-pick -x 356164431913a6a0f35f9b8aff364c095a844c22
          fi
          expected=$(git show 356164431913a6a0f35f9b8aff364c095a844c22 --pretty=format: | git patch-id --stable | cut -d' ' -f1)
          actual=$(git diff f86d8c1ffcb6b4e077b906389a39befa2a57d71c HEAD | git patch-id --stable | cut -d' ' -f1)
          test "$expected" = "$actual"
          git diff --check f86d8c1ffcb6b4e077b906389a39befa2a57d71c HEAD
          git diff --stat f86d8c1ffcb6b4e077b906389a39befa2a57d71c HEAD
          git push origin "HEAD:refs/heads/$branch"
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  rust-lint:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          save-if: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev
      - name: Rust formatting and strict workspace Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all --tests --benches -- -D warnings
          git diff --exit-code

  rust-tests:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
          lfs: true
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          save-if: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev ripgrep
      - name: Schema, Arrow nulls, encoding and dataset Blob regressions
        shell: bash
        run: |
          set -euo pipefail
          run_tests() {
            label=$1
            shift
            cargo test --profile ci "$@" 2>&1 | tee "/tmp/rc2-$label.log"
            rg -q 'test result:.*[1-9][0-9]* passed;.*0 failed' "/tmp/rc2-$label.log"
          }
          run_tests schema -p lance-core --lib test_blob_v2_descriptor_subfield_projection
          run_tests arrow -p lance-arrow --lib
          run_tests encoding -p lance-encoding --lib
          run_tests blob -p lance --lib dataset_blob
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc2-rust-regressions
          path: /tmp/rc2-*.log

  python:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          workspaces: python
          save-if: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev ripgrep
      - name: Set up repository Python environment and rebuild extension
        working-directory: python
        run: |
          make install PYTHON=3.13
          make build PYTHON=3.13
      - name: Full Blob Python regression suite and lint
        working-directory: python
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.13 python -c "import lance; print(lance.__version__); print(lance.__file__)"
          uv run --python 3.13 pytest python/tests/test_blob.py -ra --color=yes 2>&1 | tee /tmp/rc2-python.log
          rg -q '[1-9][0-9]* passed' /tmp/rc2-python.log
          uv run --python 3.13 make lint
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rc2-python-regressions
          path: /tmp/rc2-python.log

  publish-pr:
    needs: [prepare, rust-lint, rust-tests, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
      - name: Open validated backport PR
        env:
          GH_TOKEN: ${{ secrets.LANCE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch=backport/pr-10149-to-release-v14.0
          existing=$(gh pr list --repo lance-format/lance --base release/v14.0 --head "$branch" --state open --json number --jq 'length')
          if [ "$existing" -ne 0 ]; then
            gh pr list --repo lance-format/lance --base release/v14.0 --head "$branch" --state open --json number,url
            exit 0
          fi
          cat > /tmp/pr-body.md <<'BODY'
          Backport #10149 onto release/v14.0 for v14.0.0-rc.2. Resolve Blob v2 descriptor subfields in projections and filters, and propagate packed-struct parent nulls to descriptor children. The candidate patch matches the original merged PR exactly; the stored format is unchanged.

          Pre-cut validation runs strict Rust workspace Clippy and formatting, schema projection regressions, the lance-arrow and lance-encoding library suites, dataset Blob tests including the Lance 11 historical fixture, the complete Python test_blob.py suite, and Python lint using the rebuilt local extension. Every test command asserts a positive passing test count.

          This PR contains only the four files from https://github.com/lance-format/lance/pull/10149. The temporary validation workflow is outside the release branch.
          BODY
          printf '\nValidation run: https://github.com/%s/actions/runs/%s\nCandidate: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(git rev-parse HEAD)" >> /tmp/pr-body.md
          gh pr create --repo lance-format/lance --base release/v14.0 --head "$branch" --title 'fix(blob): backport descriptor subfield queries to v14' --body-file /tmp/pr-body.md
