name: Feature request
description: Suggest a new capability or an improvement to an existing one.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please search
        [existing issues](https://github.com/lance-format/lance/issues) first to
        avoid filing a duplicate.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: >-
        What are you trying to do, and why is it hard or impossible today?
        Describe the underlying need rather than a specific solution.
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Lance to do? An API sketch is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or thought about.
    validations:
      required: false
  - type: dropdown
    id: language
    attributes:
      label: Affected language binding(s)
      multiple: true
      options:
        - Python
        - Rust
        - Java
        - Format / cross-language
        - Other / not sure
    validations:
      required: false
