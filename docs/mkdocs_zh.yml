site_name: Lance 文档
site_description: "Lance 文档 - 面向多模态 AI 的开放湖仓格式"
site_url: https://lance.org/zh/
docs_dir: src_zh

repo_name: lance-format/lance
repo_url: https://github.com/lance-format/lance

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: logo/white.png
  favicon: logo/logo.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - awesome-pages

extra:
  generator: false
  alternate:
    - name: English
      link: /
      lang: en
    - name: 中文
      link: /zh/
      lang: zh
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lance-format/lance
    - icon: fontawesome/brands/discord
      link: https://discord.gg/lance

copyright: © 2025 Lance Format. 保留所有权利。

extra_css:
  - assets/stylesheets/home.css
