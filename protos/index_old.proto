syntax = "proto3";

package lance.table;

// NOTE: Do *NOT* add new index details here.  Add them to the index.proto file instead.
// This file is in the lance.table package namespace while the index.proto file is in the
// lance.index package namespace.
//
// These are only here for forward compatibility.  Older versions of Lance expect btree indexes
// to have lance.table in the package namespace.
//
// If you need to modify these messages (e.g. to add new fields to btree or bitmap) then
// it is ok to modify them here.

// Currently many of these are empty messages because all needed details are either hard-coded (e.g.
// filenames) or stored in the index itself.  However, we may want to add more details in the
// future, in particular we can add details that may be useful for planning queries (e.g. don't
// force us to load the index until we know we can make use of it)

message BTreeIndexDetails {}
message BitmapIndexDetails {}
message LabelListIndexDetails {}
message NGramIndexDetails {}
message ZoneMapIndexDetails {}
message InvertedIndexDetails {
  // Marking this field as optional as old versions of the index store blank details and we
  // need to make sure we have a proper optional field to detect this.
  optional string base_tokenizer = 1;
  string language = 2;
  bool with_position = 3;
  optional uint32 max_token_length = 4;
  bool lower_case = 5;
  bool stem = 6;
  bool remove_stop_words = 7;
  bool ascii_folding = 8;
  uint32 min_ngram_length = 9;
  uint32 max_ngram_length = 10;
  bool prefix_only = 11;
  // Path to a tokenizer plugin shared library (.so on Linux, .dylib on macOS, .dll on Windows).
  // The path can be absolute or relative to the current working directory.
  //
  // Failure modes differ by phase:
  // - Library load (file not found, missing symbols, API version mismatch,
  //  missing required vtable callback, malformed config) surfaces as a
  //  regular Err on `params.build()`, before the index is built or a query
  //  begins. These are recoverable from the caller's perspective.
  // - Failures during streaming tokenization (`next_token` returning a
  //  negative status, plugin emitting non-UTF-8 token text) panic out of
  //  the token-stream adapter to avoid silently writing or returning a
  //  truncated stream. The panic aborts the in-flight indexing or search
  //  task; recovery is the host's task-panic policy.
  //
  // The plugin must implement the Lance tokenizer plugin C ABI interface defined in include/lance_tokenizer_plugin.h.
  // When this field is set, base_tokenizer should be set to "plugin".
  //
  // SECURITY: opening an index whose manifest sets this field will dlopen the
  // referenced shared library and execute its code inside the host process.
  // Anyone with write access to the manifest (a misconfigured object store,
  // an untrusted index publisher, a shared filesystem, etc.) can therefore
  // achieve arbitrary native code execution. Only open indexes from sources
  // you trust to the same level you trust the host process itself.
  //
  // PORTABILITY: the path is absolutized against the writer's working
  // directory and stored verbatim. An index built on machine A will not
  // resolve the plugin on machine B unless both machines share the same
  // absolute path. Plugin tokenizers are intended for indexes that stay on
  // a single host; a future revision may add basename + search-dir
  // resolution for portable deployments.
  optional string tokenizer_plugin_library = 12;

  // Configuration string passed to the tokenizer plugin when creating a factory.
  // The format is defined by the plugin implementation (e.g., JSON, YAML).
  // The build path enforces that this field is set whenever tokenizer_plugin_library
  // is set, and rejects a missing value with a descriptive error. The field is
  // declared optional in proto3 because the representation of "empty" config varies
  // by serialization format (e.g., "{}" for JSON, "" for plain text), so the caller
  // must supply the format-appropriate value rather than relying on a proto default.
  optional string tokenizer_plugin_config = 13;
}
