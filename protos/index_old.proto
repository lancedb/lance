syntax = "proto3";

package lance.table;

// NOTE: Do *NOT* add new index details here.  Add them to the index.proto file instead.
// This file is in the lance.table package namespace while the index.proto file is in the
// lance.index package namespace.
//
// These are only here for forward compatibility.  Older versions of Lance expect btree indexes
// to have lance.table in the package namespace.
//
// If you need to modify these messages (e.g. to add new fields to btree or bitmap) then
// it is ok to modify them here.

// Currently many of these are empty messages because all needed details are either hard-coded (e.g.
// filenames) or stored in the index itself.  However, we may want to add more details in the
// future, in particular we can add details that may be useful for planning queries (e.g. don't
// force us to load the index until we know we can make use of it)

message BTreeIndexDetails {}
message BitmapIndexDetails {}
message LabelListIndexDetails {}
message NGramIndexDetails {}
message ZoneMapIndexDetails {}
message InvertedIndexDetails {
  // High-level analyzer profile. It selects the semantic defaults for the FTS
  // pipeline, e.g. "text" for natural-language text or "code" for code search.
  // Absent is a legacy "text" profile unless base_tokenizer is the legacy
  // "code" alias. Readers must canonicalize this before comparing details.
  optional string analyzer = 12;
  // Document-level tokenizer. It extracts searchable text from the stored value,
  // e.g. "text" for a plain string or "json" for JSON content. The extracted
  // text is then passed to base_tokenizer. Absent means text / auto-inferred
  // legacy behavior.
  optional string lance_tokenizer = 13;
  // Lexical tokenizer used after the analyzer/document layer has selected the
  // text to tokenize. This is an implementation component such as "simple",
  // "icu", "ngram", or "code"; analyzer="code" owns the code-search defaults.
  // Marking this field as optional as old versions of the index store blank details and we
  // need to make sure we have a proper optional field to detect this.
  optional string base_tokenizer = 1;
  string language = 2;
  bool with_position = 3;
  optional uint32 max_token_length = 4;
  bool lower_case = 5;
  bool stem = 6;
  bool remove_stop_words = 7;
  bool ascii_folding = 8;
  uint32 min_ngram_length = 9;
  uint32 max_ngram_length = 10;
  bool prefix_only = 11;
  // Code analyzer flag. Split one lexical identifier into subwords, e.g.
  // getUserName -> get/user/name. This changes the indexed term space and must
  // be persisted for query-time tokenizer reconstruction and segment checks.
  bool split_identifiers = 14;
  // Code analyzer flag. Split identifier subwords across letter/number
  // boundaries, e.g. HTML2JSON -> html/2/json. This changes the indexed term
  // space and must be persisted with the index.
  bool split_on_numerics = 15;
  // Code analyzer flag. Keep the complete lexical identifier in addition to
  // subwords, e.g. user_name plus user/name. This affects BM25 term statistics
  // and must be persisted with the index.
  bool preserve_original = 16;
  // Code analyzer flag. Index operator tokens such as "::", "->", and "!=".
  // Disabled by default because operators are often high-frequency noise, but
  // when enabled it changes query semantics and must be persisted.
  bool index_operators = 17;
  repeated string custom_stop_words = 19;
}
