[package]
name = "lance-sparse-reader-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "generate-sparse-fixture"
path = "../generate_sparse_fixture.rs"

[dependencies]
arrow-array = "=58.3.0"
arrow-buffer = "=58.3.0"
arrow-ipc = { version = "=58.3.0", features = ["zstd"] }
arrow-schema = "=58.3.0"
lance-core = { git = "https://github.com/lance-format/lance.git", rev = "1aca0a6d4fbb1010adb3b8fc2d0b6951a11e736b" }
lance-encoding = { git = "https://github.com/lance-format/lance.git", rev = "1aca0a6d4fbb1010adb3b8fc2d0b6951a11e736b" }
lance-file = { git = "https://github.com/lance-format/lance.git", rev = "1aca0a6d4fbb1010adb3b8fc2d0b6951a11e736b" }
lance-io = { git = "https://github.com/lance-format/lance.git", rev = "1aca0a6d4fbb1010adb3b8fc2d0b6951a11e736b" }
object_store = "=0.13.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
